<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recomendador de K-Dramas</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">🎬 K-Drama Hub</a>
            <div class="nav-links">
                <a href="/">Inicio</a>
                <a href="/usuarios.html">👥 Usuarios</a>
                <a href="/kdramas.html">🎬 K-Dramas</a>
                <a href="/personalidad.html">❤️ Personalidad</a>
                <a href="/recomendar.html" class="active">🎯 Recomendador</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>🎯 Recomendaciones Personalizadas</h2>
            <div class="form-group">
                <label>ID del Usuario</label>
                <input type="number" id="id_usuario" placeholder="Ej: 1" required>
            </div>
            <button class="btn" onclick="obtenerRecomendaciones()">Obtener Recomendaciones</button>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>📺 K-Dramas Recomendados</h2>
                <button class="btn btn-outline" onclick="limpiarRecomendaciones()">Limpiar</button>
            </div>
            <div id="recomendaciones" style="margin-top: 1rem;">
                <p style="color: #aaa;">Ingresa un ID de usuario para ver recomendaciones personalizadas</p>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        async function obtenerRecomendaciones() {
            const id_usuario = document.getElementById("id_usuario").value;
            if (!id_usuario) {
                alert("Ingresa un ID de usuario");
                return;
            }
            try {
                const response = await fetch(`${API}/recomendar/${id_usuario}`);
                if (!response.ok) {
                    if (response.status === 404) alert("Usuario sin personalidad registrada");
                    else throw new Error();
                    return;
                }
                const recs = await response.json();
                const container = document.getElementById("recomendaciones");
                if (recs.length === 0) {
                    container.innerHTML = '<p style="color: #aaa;">No hay recomendaciones para este usuario</p>';
                    return;
                }
                container.innerHTML = recs.map(d => `
                    <div style="background:#1f1f2e;border-radius:10px;padding:1rem;margin-bottom:0.8rem;border-left:4px solid #e50914;">
                        <h3 style="margin-bottom:0.5rem;">${d.nombre}</h3>
                        <p>🎭 Género: ${d.genero} | 💖 Nivel emocional: ${d.nivel_emocional}/10</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error(error);
                alert("Error al obtener recomendaciones");
            }
        }

        function limpiarRecomendaciones() {
            document.getElementById("recomendaciones").innerHTML = '<p style="color: #aaa;">Ingresa un ID de usuario para ver recomendaciones personalizadas</p>';
            document.getElementById("id_usuario").value = "";
        }
    </script>
</body>
</html>
