<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">🎬 K-Drama Hub</a>
            <div class="nav-links">
                <a href="/">Inicio</a>
                <a href="/usuarios.html" class="active">👥 Usuarios</a>
                <a href="/kdramas.html">🎬 K-Dramas</a>
                <a href="/personalidad.html">❤️ Personalidad</a>
                <a href="/recomendar.html">🎯 Recomendador</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>👤 Crear Usuario</h2>
            <form id="formUsuario">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Edad</label>
                    <input type="number" id="edad" required>
                </div>
                <button type="submit" class="btn">Crear Usuario</button>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>📋 Lista de Usuarios</h2>
                <button class="btn btn-outline" onclick="cargarUsuarios()">Actualizar</button>
            </div>
            <table class="tabla">
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Edad</th></tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>
            </table>
        </div>
    </div>

    <script src="/js/usuarios.js"></script>
</body>
</html>
