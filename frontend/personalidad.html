<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Personalidad del Usuario</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">🎬 K-Drama Hub</a>
            <div class="nav-links">
                <a href="/">Inicio</a>
                <a href="/usuarios.html">👥 Usuarios</a>
                <a href="/kdramas.html">🎬 K-Dramas</a>
                <a href="/personalidad.html" class="active">❤️ Personalidad</a>
                <a href="/recomendar.html">🎯 Recomendador</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>❤️ Asignar Personalidad</h2>
            <form id="formPersonalidad">
                <div class="form-group">
                    <label>ID Usuario</label>
                    <input type="number" id="id_usuario" required>
                </div>
                <label>Tipos de personalidad</label>
                <div class="checks">
                    <label><input type="checkbox" id="romantico"> Romántico</label>
                    <label><input type="checkbox" id="aventurero"> Aventurero</label>
                    <label><input type="checkbox" id="sensible"> Sensible</label>
                    <label><input type="checkbox" id="extrovertido"> Extrovertido</label>
                    <label><input type="checkbox" id="oscuro"> Oscuro</label>
                    <label><input type="checkbox" id="intenso"> Intenso</label>
                </div>
                <button type="submit" class="btn">Guardar Personalidad</button>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>📋 Lista de Personalidades</h2>
                <button class="btn btn-outline" onclick="cargarPersonalidades()">Actualizar</button>
            </div>
            <table class="tabla">
                <thead>
                    <tr><th>ID</th><th>Usuario</th><th>Rom</th><th>Avent</th><th>Sens</th><th>Ext</th><th>Osc</th><th>Int</th></tr>
                </thead>
                <tbody id="tablaPersonalidad"></tbody>
            </table>
        </div>
    </div>

    <script src="/js/personalidad.js"></script>
</body>
</html>
