<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - K-Drama Hub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .perfil-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e8daff;
        }
        .perfil-tab {
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            background: transparent;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: #8b8baa;
            transition: all 0.3s ease;
        }
        .perfil-tab.active {
            color: #7c3aed;
            border-bottom: 3px solid #c084fc;
        }
        .perfil-panel {
            display: none;
        }
        .perfil-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 20px;
            max-width: 540px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(124,58,237,0.18);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity:0; transform: scale(0.92) translateY(20px); }
            to   { opacity:1; transform: scale(1) translateY(0); }
        }
        .modal-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }
        .modal-no-img {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: linear-gradient(135deg, #f3e8ff, #e9d5ff);
            border-radius: 20px 20px 0 0;
        }
        .modal-body { padding: 1.5rem 1.8rem 1.8rem; }
        .modal-title { font-size: 1.4rem; font-weight: 700; color: #3b1f6e; margin-bottom: 0.3rem; }
        .modal-genre {
            display: inline-block;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            color: white;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 1rem;
        }
        .modal-desc { font-size: 0.95rem; color: #4a4a6a; line-height: 1.65; margin-bottom: 1.2rem; }
        .modal-emotional-label { font-size: 0.9rem; font-weight: 600; color: #7c3aed; margin-bottom: 0.4rem; }
        .modal-bar { background: #f3e8ff; border-radius: 10px; height: 10px; overflow: hidden; margin-bottom: 1.4rem; }
        .modal-bar-fill { height: 100%; background: linear-gradient(90deg, #c084fc, #a855f7); border-radius: 10px; }
        .modal-close {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-close:hover { opacity: 0.88; }
        .kdrama-card { cursor: pointer; }
    </style>
</head>
<body>
    <!-- Modal detalle K-Drama -->
    <div class="modal-overlay" id="modalOverlay" onclick="cerrarModal(event)">
        <div class="modal-box" id="modalBox">
            <div id="modalImgArea"></div>
            <div class="modal-body">
                <div class="modal-title" id="modalTitulo"></div>
                <span class="modal-genre" id="modalGenero"></span>
                <p class="modal-desc" id="modalDesc"></p>
                <div class="modal-emotional-label" id="modalEmocional"></div>
                <div class="modal-bar">
                    <div class="modal-bar-fill" id="modalBarFill"></div>
                </div>
                <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">Cerrar</button>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">🎬 K-Drama Hub</a>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>👤 Mi Perfil</h1>
            <p id="bienvenida"></p>
        </div>

        <div class="card">
            <div class="perfil-tabs">
                <button class="perfil-tab active" onclick="mostrarPanel('personalidad')">❤️ Mi Personalidad</button>
                <button class="perfil-tab" onclick="mostrarPanel('recomendaciones')">🎯 Mis Recomendaciones</button>
            </div>

            <!-- Panel Personalidad -->
            <div id="personalidadPanel" class="perfil-panel active">
                <form id="formPersonalidad">
                    <div class="form-group">
                        <label>¿Cómo te identificas?</label>
                        <div class="checks">
                            <label><input type="checkbox" id="romantico"> 💕 Romántico</label>
                            <label><input type="checkbox" id="aventurero"> ⚔️ Aventurero</label>
                            <label><input type="checkbox" id="sensible"> 🌸 Sensible</label>
                            <label><input type="checkbox" id="extrovertido"> 🎉 Extrovertido</label>
                            <label><input type="checkbox" id="oscuro"> 🌑 Oscuro</label>
                            <label><input type="checkbox" id="intenso"> 🔥 Intenso</label>
                        </div>
                    </div>
                    <button type="submit" class="btn">Guardar mi Personalidad</button>
                </form>
                <div id="personalidadMessage" class="message" style="margin-top: 1rem;"></div>
            </div>

            <!-- Panel Recomendaciones -->
            <div id="recomendacionesPanel" class="perfil-panel">
                <div id="recomendacionesContent">
                    <p style="color: #aaa;">Completa tu personalidad para ver recomendaciones</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        const token = localStorage.getItem("token");
        const usuarioNombre = localStorage.getItem("usuario_nombre");
        const usuarioRol = localStorage.getItem("usuario_rol");

        if (!token) {
            window.location.href = "/login.html";
        }

        // Navegación
        const navLinks = document.getElementById("navLinks");
        if (usuarioRol === "admin") {
            navLinks.innerHTML = `
                <a href="/">Inicio</a>
                <a href="/admin.html">👑 Admin</a>
                <a href="/perfil.html" class="active">👤 Mi Perfil</a>
                <span class="user-name">👋 ${usuarioNombre}</span>
                <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
            `;
        } else {
            navLinks.innerHTML = `
                <a href="/">Inicio</a>
                <a href="/perfil.html" class="active">👤 Mi Perfil</a>
                <span class="user-name">👋 ${usuarioNombre}</span>
                <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
            `;
        }

        document.getElementById("bienvenida").innerHTML = `Hola, ${usuarioNombre}! Configura tu personalidad para obtener recomendaciones.`;

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/";
        }

        function mostrarPanel(panel) {
            document.querySelectorAll('.perfil-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.perfil-panel').forEach(p => p.classList.remove('active'));

            if (panel === 'personalidad') {
                document.querySelector('.perfil-tab:first-child').classList.add('active');
                document.getElementById('personalidadPanel').classList.add('active');
            } else {
                document.querySelector('.perfil-tab:last-child').classList.add('active');
                document.getElementById('recomendacionesPanel').classList.add('active');
                cargarRecomendaciones();
            }
        }

        // Cargar personalidad actual
        async function cargarPersonalidad() {
            try {
                const response = await fetch(`${API}/personalidad/mi-personalidad`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.tiene) {
                    const p = data.personalidad;
                    document.getElementById("romantico").checked = p.romantico === true || p.romantico === "True";
                    document.getElementById("aventurero").checked = p.aventurero === true || p.aventurero === "True";
                    document.getElementById("sensible").checked = p.sensible === true || p.sensible === "True";
                    document.getElementById("extrovertido").checked = p.extrovertido === true || p.extrovertido === "True";
                    document.getElementById("oscuro").checked = p.oscuro === true || p.oscuro === "True";
                    document.getElementById("intenso").checked = p.intenso === true || p.intenso === "True";
                }
            } catch (error) {
                console.error(error);
            }
        }

        // Guardar personalidad
        document.getElementById("formPersonalidad").addEventListener("submit", async (e) => {
            e.preventDefault();

            const data = {
                romantico: document.getElementById("romantico").checked,
                aventurero: document.getElementById("aventurero").checked,
                sensible: document.getElementById("sensible").checked,
                extrovertido: document.getElementById("extrovertido").checked,
                oscuro: document.getElementById("oscuro").checked,
                intenso: document.getElementById("intenso").checked,
            };

            const messageDiv = document.getElementById("personalidadMessage");

            try {
                const response = await fetch(`${API}/personalidad/mi-personalidad`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error();

                messageDiv.className = "message success";
                messageDiv.textContent = "✅ Personalidad guardada correctamente!";

                setTimeout(() => {
                    messageDiv.style.display = "none";
                }, 3000);

            } catch (error) {
                messageDiv.className = "message error";
                messageDiv.textContent = "❌ Error al guardar personalidad";
            }
        });

        // Cargar recomendaciones
        async function cargarRecomendaciones() {
            const container = document.getElementById("recomendacionesContent");
            container.innerHTML = '<p>Cargando recomendaciones...</p>';

            try {
                const response = await fetch(`${API}/recomendar/mis-recomendaciones`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.status === 404) {
                    container.innerHTML = '<p>❌ No tienes personalidad registrada. Ve a "Mi Personalidad" para configurarla.</p>';
                    return;
                }

                if (!response.ok) throw new Error();

                const data = await response.json();

                if (data.total === 0) {
                    container.innerHTML = '<p>😢 No hay K-Dramas que coincidan con tu personalidad aún.</p>';
                    return;
                }

                container.innerHTML = `
                    <p style="margin-bottom: 1rem;">Encontramos ${data.total} K-Dramas para ti:</p>
                    <div class="kdrama-grid">
                        ${data.recomendaciones.map(kd => `
                            <div class="kdrama-card" onclick="abrirModal(${kd.id})">
                                <div class="kdrama-image">
                                    ${kd.imagen_url
                                        ? `<img src="${kd.imagen_url}" alt="${kd.nombre}">`
                                        : `<div class="no-image">${getIconoPorGenero(kd.genero)}</div>`}
                                </div>
                                <div class="kdrama-info">
                                    <div class="kdrama-title">${kd.nombre}</div>
                                    <div class="kdrama-genre">${kd.genero}</div>
                                    ${kd.descripcion ? `<div class="kdrama-desc" style="font-size:0.82rem;color:#6b6b8a;margin:0.3rem 0 0.5rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${kd.descripcion}</div>` : ''}
                                    <div class="kdrama-emotional">Nivel emocional: ${kd.nivel_emocional}/10</div>
                                    <div class="emotional-bar">
                                        <div class="emotional-fill" style="width: ${(kd.nivel_emocional / 10) * 100}%"></div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                recomendacionesData = data.recomendaciones;

            } catch (error) {
                container.innerHTML = '<p>❌ Error al cargar recomendaciones</p>';
            }
        }

        cargarPersonalidad();

        let recomendacionesData = [];

        function abrirModal(id) {
            const kd = recomendacionesData.find(k => k.id === id);
            if (!kd) return;

            const imgArea = document.getElementById('modalImgArea');
            imgArea.innerHTML = kd.imagen_url
                ? `<img class="modal-img" src="${kd.imagen_url}" alt="${kd.nombre}">`
                : `<div class="modal-no-img">${getIconoPorGenero(kd.genero)}</div>`;

            document.getElementById('modalTitulo').textContent = kd.nombre;
            document.getElementById('modalGenero').textContent = `${getIconoPorGenero(kd.genero)} ${kd.genero}`;
            document.getElementById('modalDesc').textContent = kd.descripcion || 'Sin descripción disponible.';
            document.getElementById('modalEmocional').textContent = `Nivel emocional: ${kd.nivel_emocional}/10`;
            document.getElementById('modalBarFill').style.width = `${(kd.nivel_emocional / 10) * 100}%`;

            document.getElementById('modalOverlay').classList.add('open');
        }

        function cerrarModal(e) {
            if (e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('open');
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
        });

        function getIconoPorGenero(genero) {
            const iconos = {
                'romance': '💕', 'accion': '⚔️', 'comedia': '😂',
                'terror': '😱', 'suspenso': '🔪', 'drama': '🎭'
            };
            return iconos[genero?.toLowerCase()] || '🎬';
        }
    </script>
</body>
</html>
