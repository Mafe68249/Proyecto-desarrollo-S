<nav class="navbar">
    <div class="navbar-container">
        <a href="/" class="logo">🎬 K-Drama Hub</a>
        <div class="nav-links" id="navLinks"></div>
    </div>
</nav>

<script>
    const token = localStorage.getItem("token");
    const usuarioNombre = localStorage.getItem("usuario_nombre");
    const usuarioRol = localStorage.getItem("usuario_rol");
    const navLinks = document.getElementById("navLinks");

    if (token) {
        if (usuarioRol === "admin") {
            navLinks.innerHTML = `
                <a href="/">Inicio</a>
                <a href="/admin.html">👑 Admin</a>
                <a href="/mi-personalidad.html">❤️ Mi Personalidad</a>
                <a href="/mis-recomendaciones.html">🎯 Recomendaciones</a>
                <span style="color: #e50914;">👋 ${usuarioNombre}</span>
                <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
            `;
        } else {
            navLinks.innerHTML = `
                <a href="/">Inicio</a>
                <a href="/mi-personalidad.html">❤️ Mi Personalidad</a>
                <a href="/mis-recomendaciones.html">🎯 Recomendaciones</a>
                <span style="color: #e50914;">👋 ${usuarioNombre}</span>
                <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
            `;
        }
    } else {
        navLinks.innerHTML = `
            <a href="/">Inicio</a>
            <a href="/login.html">🔐 Iniciar Sesión</a>
        `;
    }

    function cerrarSesion() {
        localStorage.clear();
        window.location.href = "/";
        return false;
    }
</script>
