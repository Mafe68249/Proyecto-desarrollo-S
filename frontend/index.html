<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Drama Hub - Tu plataforma de K-Dramas</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .search-bar {
            display: flex;
            align-items: center;
            background: #f9f8ff;
            border: 2px solid #e8daff;
            border-radius: 30px;
            padding: 0.3rem 0.3rem 0.3rem 1rem;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }
        .search-bar:focus-within {
            border-color: #c084fc;
            box-shadow: 0 0 0 3px rgba(192,132,252,0.15);
            background: white;
        }
        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            font-size: 0.9rem;
            color: #4a4a6a;
            width: 180px;
        }
        .search-bar input::placeholder { color: #bbb; }
        .search-bar button {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            border: none;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .search-bar button:hover { background: linear-gradient(135deg,#a855f7,#9333ea); }
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 2rem;
        }
        .filter-btn {
            background: white;
            border: 2px solid #e8daff;
            color: #7c3aed;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: linear-gradient(135deg,#c084fc,#a855f7);
            color: white;
            border-color: transparent;
        }
        .results-count {
            font-size: 0.9rem;
            color: #8b8baa;
            margin-bottom: 1rem;
        }
        .kdrama-desc {
            font-size: 0.82rem;
            color: #6b6b8a;
            margin: 0.3rem 0 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .search-clear {
            background: none;
            border: none;
            color: #c084fc;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
            padding: 0;
        }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 20px;
            max-width: 540px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(124,58,237,0.18);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            from { opacity:0; transform: scale(0.92) translateY(20px); }
            to   { opacity:1; transform: scale(1) translateY(0); }
        }
        .modal-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }
        .modal-no-img {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: linear-gradient(135deg, #f3e8ff, #e9d5ff);
            border-radius: 20px 20px 0 0;
        }
        .modal-body {
            padding: 1.5rem 1.8rem 1.8rem;
        }
        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #3b1f6e;
            margin-bottom: 0.3rem;
        }
        .modal-genre {
            display: inline-block;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            color: white;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 1rem;
        }
        .modal-desc {
            font-size: 0.95rem;
            color: #4a4a6a;
            line-height: 1.65;
            margin-bottom: 1.2rem;
        }
        .modal-emotional-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #7c3aed;
            margin-bottom: 0.4rem;
        }
        .modal-bar {
            background: #f3e8ff;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 1.4rem;
        }
        .modal-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #c084fc, #a855f7);
            border-radius: 10px;
            transition: width 0.6s ease;
        }
        .modal-close {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-close:hover { opacity: 0.88; }
        .kdrama-card { cursor: pointer; }
    </style>
</head>
<body>
    <!-- Modal detalle K-Drama -->
    <div class="modal-overlay" id="modalOverlay" onclick="cerrarModal(event)">
        <div class="modal-box" id="modalBox">
            <div id="modalImgArea"></div>
            <div class="modal-body">
                <div class="modal-title" id="modalTitulo"></div>
                <span class="modal-genre" id="modalGenero"></span>
                <p class="modal-desc" id="modalDesc"></p>
                <div class="modal-emotional-label" id="modalEmocional"></div>
                <div class="modal-bar">
                    <div class="modal-bar-fill" id="modalBarFill"></div>
                </div>
                <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')">✕ Cerrar</button>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">🎬 K-Drama Hub</a>
            <div class="search-bar">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar K-Drama..." autocomplete="off">
                <button onclick="buscar()">Buscar</button>
            </div>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>🎬 Descubre tu próximo K-Drama</h1>
            <p>Explora nuestro catálogo y encuentra dramas según tu personalidad</p>
        </div>

        <div class="filter-bar">
            <span style="font-weight:600; color:#7c3aed; margin-right:0.5rem;">Filtrar:</span>
            <button class="filter-btn active" onclick="filtrarGenero('todos', this)">Todos</button>
            <button class="filter-btn" onclick="filtrarGenero('romance', this)">💕 Romance</button>
            <button class="filter-btn" onclick="filtrarGenero('accion', this)">⚔️ Acción</button>
            <button class="filter-btn" onclick="filtrarGenero('comedia', this)">😂 Comedia</button>
            <button class="filter-btn" onclick="filtrarGenero('drama', this)">🎭 Drama</button>
            <button class="filter-btn" onclick="filtrarGenero('terror', this)">😱 Terror</button>
            <button class="filter-btn" onclick="filtrarGenero('suspenso', this)">🔪 Suspenso</button>
        </div>

        <div id="resultsInfo" class="results-count" style="display:none;"></div>

        <h2 class="section-title" id="sectionTitle">📺 Todos los K-Dramas</h2>
        <div class="kdrama-grid" id="kdramaGrid">
            <div class="loading-card">Cargando K-Dramas...</div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        const token = localStorage.getItem("token");
        const usuarioNombre = localStorage.getItem("usuario_nombre");
        const usuarioRol = localStorage.getItem("usuario_rol");
        let todosLosKDramas = [];

        const navLinks = document.getElementById("navLinks");
        if (token) {
            const adminLink = usuarioRol === "admin" ? `<a href="/admin.html">👑 Admin</a>` : "";
            navLinks.innerHTML = `
                <a href="/">Inicio</a>
                ${adminLink}
                <a href="/estadisticas.html">📊 Stats</a>
                <a href="/perfil.html">👤 Mi Perfil</a>
                <span class="user-name">👋 ${usuarioNombre}</span>
                <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
            `;
        } else {
            navLinks.innerHTML = `
                <a href="/">Inicio</a>
                <a href="/estadisticas.html">📊 Stats</a>
                <a href="/login.html">🔐 Iniciar Sesión</a>
            `;
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/";
            return false;
        }

        function getIconoPorGenero(genero) {
            const iconos = { romance:'💕', accion:'⚔️', comedia:'😂', terror:'😱', suspenso:'🔪', drama:'🎭' };
            return iconos[genero?.toLowerCase()] || '🎬';
        }

        function renderKDramas(lista) {
            const grid = document.getElementById("kdramaGrid");
            const info = document.getElementById("resultsInfo");

            if (!lista || lista.length === 0) {
                grid.innerHTML = '<div class="empty-message">📺 No se encontraron K-Dramas.</div>';
                info.style.display = "none";
                return;
            }

            grid.innerHTML = lista.map(kd => `
                <div class="kdrama-card" onclick="abrirModal(${kd.id})">
                    <div class="kdrama-image">
                        ${kd.imagen_url
                            ? `<img src="${kd.imagen_url}" alt="${kd.nombre}">`
                            : `<div class="no-image">${getIconoPorGenero(kd.genero)}</div>`}
                    </div>
                    <div class="kdrama-info">
                        <div class="kdrama-title">${kd.nombre}</div>
                        <div class="kdrama-genre">${kd.genero}</div>
                        ${kd.descripcion ? `<div class="kdrama-desc">${kd.descripcion}</div>` : ''}
                        <div class="kdrama-emotional">💖 Nivel emocional: ${kd.nivel_emocional}/10</div>
                        <div class="emotional-bar">
                            <div class="emotional-fill" style="width:${(kd.nivel_emocional/10)*100}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function cargarKDramas() {
            try {
                const response = await fetch(API + "/kdramas");
                todosLosKDramas = await response.json();
                renderKDramas(todosLosKDramas);
            } catch (error) {
                document.getElementById("kdramaGrid").innerHTML = '<div class="error-message">❌ Error al cargar los K-Dramas</div>';
            }
        }

        function buscar() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            const info = document.getElementById("resultsInfo");
            const title = document.getElementById("sectionTitle");

            if (!query) {
                renderKDramas(todosLosKDramas);
                info.style.display = "none";
                title.textContent = "📺 Todos los K-Dramas";
                return;
            }

            const resultados = todosLosKDramas.filter(kd =>
                kd.nombre.toLowerCase().includes(query) ||
                kd.genero.toLowerCase().includes(query)
            );

            title.textContent = `🔍 Resultados para "${query}"`;
            info.style.display = "block";
            info.innerHTML = `${resultados.length} resultado(s) encontrado(s) — <button class="search-clear" onclick="limpiarBusqueda()">limpiar búsqueda</button>`;
            renderKDramas(resultados);

            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn').classList.add('active');
        }

        function limpiarBusqueda() {
            document.getElementById("searchInput").value = "";
            renderKDramas(todosLosKDramas);
            document.getElementById("resultsInfo").style.display = "none";
            document.getElementById("sectionTitle").textContent = "📺 Todos los K-Dramas";
        }

        function filtrarGenero(genero, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById("searchInput").value = "";
            document.getElementById("resultsInfo").style.display = "none";

            if (genero === 'todos') {
                document.getElementById("sectionTitle").textContent = "📺 Todos los K-Dramas";
                renderKDramas(todosLosKDramas);
            } else {
                const filtrados = todosLosKDramas.filter(kd => kd.genero.toLowerCase() === genero);
                document.getElementById("sectionTitle").textContent = `📺 Género: ${genero}`;
                renderKDramas(filtrados);
            }
        }

        // Buscar al presionar Enter
        document.getElementById("searchInput").addEventListener("keydown", e => {
            if (e.key === "Enter") buscar();
        });

        function abrirModal(id) {
            const kd = todosLosKDramas.find(k => k.id === id);
            if (!kd) return;

            // Imagen o emoji
            const imgArea = document.getElementById('modalImgArea');
            imgArea.innerHTML = kd.imagen_url
                ? `<img class="modal-img" src="${kd.imagen_url}" alt="${kd.nombre}">`
                : `<div class="modal-no-img">${getIconoPorGenero(kd.genero)}</div>`;

            document.getElementById('modalTitulo').textContent = kd.nombre;
            document.getElementById('modalGenero').textContent = `${getIconoPorGenero(kd.genero)} ${kd.genero}`;
            document.getElementById('modalDesc').textContent = kd.descripcion || 'Sin descripción disponible.';
            document.getElementById('modalEmocional').textContent = `💖 Nivel emocional: ${kd.nivel_emocional}/10`;
            document.getElementById('modalBarFill').style.width = `${(kd.nivel_emocional/10)*100}%`;

            document.getElementById('modalOverlay').classList.add('open');
        }

        function cerrarModal(e) {
            // Cierra solo si se hace clic en el overlay, no dentro del box
            if (e.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('open');
            }
        }

        // Cerrar con Escape
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('open');
        });

        cargarKDramas();
    </script>
</body>
</html>
