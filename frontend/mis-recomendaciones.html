<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Recomendaciones - K-Drama Hub</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">🎬 K-Drama Hub</a>
            <div class="nav-links" id="navLinks"></div>
        </div>
    </nav>

    <div class="container">
        <div class="hero" style="text-align: center; padding: 2rem;">
            <h1>🎯 Recomendaciones para ti</h1>
            <p id="mensajePersonalidad" style="color: #aaa;"></p>
        </div>

        <div class="kdrama-grid" id="recomendacionesGrid">
            <div style="text-align: center; grid-column: 1/-1; color: #aaa;">
                Cargando recomendaciones...
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        const token = localStorage.getItem("token");
        const usuarioNombre = localStorage.getItem("usuario_nombre");
        const usuarioRol = localStorage.getItem("usuario_rol");

        if (!token) {
            window.location.href = "/login.html";
        }

        const navLinks = document.getElementById("navLinks");
        if (usuarioRol === "admin") {
            navLinks.innerHTML = `
                <a href="/">Inicio</a>
                <a href="/admin.html">👑 Admin</a>
                <a href="/mi-personalidad.html">❤️ Mi Personalidad</a>
                <a href="/mis-recomendaciones.html" class="active">🎯 Mis Recomendaciones</a>
                <span style="color: #e50914;">👋 ${usuarioNombre}</span>
                <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
            `;
        } else {
            navLinks.innerHTML = `
                <a href="/">Inicio</a>
                <a href="/mi-personalidad.html">❤️ Mi Personalidad</a>
                <a href="/mis-recomendaciones.html" class="active">🎯 Mis Recomendaciones</a>
                <span style="color: #e50914;">👋 ${usuarioNombre}</span>
                <a href="#" onclick="cerrarSesion()">🚪 Salir</a>
            `;
        }

        async function cargarRecomendaciones() {
            try {
                const response = await fetch(`${API}/recomendar/mis-recomendaciones`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.status === 404) {
                    document.getElementById("recomendacionesGrid").innerHTML = `
                        <div style="text-align: center; grid-column: 1/-1;">
                            <p>❌ No tienes personalidad registrada.</p>
                            <p>Ve a <a href="/mi-personalidad.html">Mi Personalidad</a> para configurarla primero.</p>
                        </div>
                    `;
                    document.getElementById("mensajePersonalidad").innerHTML = "Completa tu perfil de personalidad para ver recomendaciones";
                    return;
                }

                if (!response.ok) throw new Error();

                const data = await response.json();

                if (data.total === 0) {
                    document.getElementById("recomendacionesGrid").innerHTML = `
                        <div style="text-align: center; grid-column: 1/-1;">
                            <p>😢 No hay K-Dramas que coincidan con tu personalidad aún.</p>
                        </div>
                    `;
                    document.getElementById("mensajePersonalidad").innerHTML = `Basado en tu personalidad, encontramos ${data.total} recomendaciones`;
                    return;
                }

                document.getElementById("mensajePersonalidad").innerHTML = `Basado en tu personalidad, encontramos ${data.total} K-Dramas para ti`;

                document.getElementById("recomendacionesGrid").innerHTML = data.recomendaciones.map(kd => `
                    <div class="kdrama-card">
                        <div class="kdrama-image">
                            ${kd.imagen_base64 ?
    `<img src="${kd.imagen_base64}" alt="${kd.nombre}" style="width: 100%; height: 100%; object-fit: cover;">` :
    `<div style="font-size: 4rem; display: flex; align-items: center; justify-content: center; height: 100%;">${getIconoPorGenero(kd.genero)}</div>`}
                        </div>
                        <div class="kdrama-info">
                            <div class="kdrama-title">${kd.nombre}</div>
                            <div class="kdrama-genre">${kd.genero}</div>
                            <div class="kdrama-emotional">💖 Nivel emocional: ${kd.nivel_emocional}/10</div>
                            <div class="emotional-bar">
                                <div class="emotional-fill" style="width: ${(kd.nivel_emocional / 10) * 100}%"></div>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error(error);
                document.getElementById("recomendacionesGrid").innerHTML = '<div style="text-align: center; grid-column: 1/-1; color: #e50914;">Error al cargar recomendaciones</div>';
            }
        }

        function getIconoPorGenero(genero) {
            const iconos = {
                'romance': '💕', 'accion': '⚔️', 'comedia': '😂',
                'terror': '😱', 'suspenso': '🔪', 'drama': '🎭',
                'misterio': '🕵️', 'thriller': '🔫'
            };
            return iconos[genero?.toLowerCase()] || '🎬';
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "/login.html";
            return false;
        }

        cargarRecomendaciones();
    </script>
</body>
</html>
