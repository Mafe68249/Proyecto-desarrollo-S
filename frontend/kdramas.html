<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>K-Dramas</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<header class="header">
    <h1>🎬 Gestión de K-Dramas</h1>
</header>

<div class="container">

    <!-- FORMULARIO -->
    <div class="card">
        <h2>Nuevo K-Drama</h2>

        <form id="formKDrama">

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="nombre" required>
            </div>

            <div class="form-group">
                <label>Género</label>
                <select id="genero">
                    <option>Romance</option>
                    <option>Misterio</option>
                    <option>Comedia</option>
                    <option>Acción</option>
                    <option>Drama</option>
                    <option>Thriller</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nivel emocional (1-10)</label>
                <input type="number" id="nivel_emocional" min="1" max="10">
            </div>

            <button type="submit" class="btn">Guardar K-Drama</button>
        </form>
    </div>

    <!-- LISTA -->
    <div class="card">

        <div class="card-header">
            <h2>Lista de K-Dramas</h2>
            <button class="btn" onclick="cargarKDramas()">Actualizar</button>
        </div>

        <table class="tabla">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Género</th>
                    <th>Nivel emocional</th>
                </tr>
            </thead>

            <tbody id="tablaKDramas"></tbody>

        </table>

    </div>

</div>

<script src="/js/kdramas.js"></script>

</body>
</html>
