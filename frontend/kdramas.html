<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de K-Dramas</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">🎬 K-Drama Hub</a>
            <div class="nav-links">
                <a href="/">Inicio</a>
                <a href="/usuarios.html">👥 Usuarios</a>
                <a href="/kdramas.html" class="active">🎬 K-Dramas</a>
                <a href="/personalidad.html">❤️ Personalidad</a>
                <a href="/recomendar.html">🎯 Recomendador</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>🎬 Agregar Nuevo K-Drama</h2>
            <form id="formKDrama">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label>Género</label>
                    <select id="genero">
                        <option>Romance</option>
                        <option>Acción</option>
                        <option>Comedia</option>
                        <option>Drama</option>
                        <option>Terror</option>
                        <option>Suspenso</option>
                        <option>Misterio</option>
                        <option>Thriller</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nivel emocional (1-10)</label>
                    <input type="number" id="nivel_emocional" min="1" max="10">
                </div>
                <button type="submit" class="btn">Guardar K-Drama</button>
            </form>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>📺 Lista de K-Dramas</h2>
                <button class="btn btn-outline" onclick="cargarKDramas()">Actualizar</button>
            </div>
            <table class="tabla">
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Género</th><th>Nivel emocional</th></tr>
                </thead>
                <tbody id="tablaKDramas"></tbody>
            </table>
        </div>
    </div>

    <script src="/js/kdramas.js"></script>
</body>
</html>
