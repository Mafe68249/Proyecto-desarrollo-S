<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - K-Drama Hub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .tab-container {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e8daff;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem;
            cursor: pointer;
            background: transparent;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            color: #8b8baa;
            transition: all 0.3s ease;
        }
        .tab.active {
            color: #7c3aed;
            border-bottom: 3px solid #c084fc;
        }
        .tab:hover {
            color: #c084fc;
        }
        .form-panel {
            display: none;
        }
        .form-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .access-container {
            max-width: 450px;
            margin: 60px auto;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">🎬 K-Drama Hub</a>
            <div class="nav-links">
                <a href="/">Inicio</a>
                <a href="/login.html" class="active">🔐 Acceso</a>
            </div>
        </div>
    </nav>

    <div class="access-container">
        <div class="card" style="padding: 2rem;">
            <div class="tab-container">
                <button class="tab active" onclick="mostrarPanel('login')">Iniciar Sesión</button>
                <button class="tab" onclick="mostrarPanel('registro')">Crear Cuenta</button>
            </div>

            <!-- Panel Login -->
            <div id="loginPanel" class="form-panel active">
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login_email" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="login_password" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
                </form>
                <div id="loginMessage" class="message"></div>
            </div>

            <!-- Panel Registro -->
            <div id="registroPanel" class="form-panel">
                <form id="registroForm">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="reg_nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Edad</label>
                        <input type="number" id="reg_edad" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg_email" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="reg_password" required>
                    </div>
                    <button type="submit" class="btn" style="width: 100%;">Registrarse</button>
                </form>
                <div id="registroMessage" class="message"></div>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        // Verificar si ya está logueado
        if (localStorage.getItem("token")) {
            const rol = localStorage.getItem("usuario_rol");
            window.location.href = rol === "admin" ? "/admin.html" : "/";
        }

        function mostrarPanel(panel) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(panel => panel.classList.remove('active'));

            if (panel === 'login') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('loginPanel').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('registroPanel').classList.add('active');
            }
        }

        // Login
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("login_email").value;
            const password = document.getElementById("login_password").value;
            const messageDiv = document.getElementById("loginMessage");

            try {
                const response = await fetch(`${API}/login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
                    method: "POST"
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || "Error al iniciar sesión");
                }

                const data = await response.json();

                localStorage.setItem("token", data.access_token);
                localStorage.setItem("usuario_id", data.usuario_id);
                localStorage.setItem("usuario_nombre", data.nombre);
                localStorage.setItem("usuario_rol", data.rol);

                messageDiv.className = "message success";
                messageDiv.textContent = "✅ Inicio exitoso! Redirigiendo...";

                setTimeout(() => {
                    window.location.href = data.rol === "admin" ? "/admin.html" : "/";
                }, 1500);

            } catch (error) {
                messageDiv.className = "message error";
                messageDiv.textContent = error.message;
            }
        });

        // Registro
        document.getElementById("registroForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const nombre = document.getElementById("reg_nombre").value;
            const edad = document.getElementById("reg_edad").value;
            const email = document.getElementById("reg_email").value;
            const password = document.getElementById("reg_password").value;
            const messageDiv = document.getElementById("registroMessage");

            try {
                const response = await fetch(`${API}/registro?nombre=${encodeURIComponent(nombre)}&edad=${edad}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
                    method: "POST"
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Error al registrar");
                }

                messageDiv.className = "message success";
                messageDiv.textContent = "✅ Registro exitoso! Ahora inicia sesión.";

                setTimeout(() => {
                    mostrarPanel('login');
                    document.getElementById("login_email").value = email;
                    document.getElementById("login_password").value = "";
                }, 2000);

            } catch (error) {
                messageDiv.className = "message error";
                messageDiv.textContent = error.message;
            }
        });
    </script>
</body>
</html>
