<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - K-Drama Hub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
        .login-card {
            background: #1f1f2e;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }
        .login-card h1 {
            color: #e50914;
            margin-bottom: 1.5rem;
        }
        .message {
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 5px;
            display: none;
        }
        .message.error {
            background: rgba(229,9,20,0.2);
            color: #e50914;
            display: block;
        }
        .message.success {
            background: rgba(76,175,80,0.2);
            color: #4caf50;
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">🎬 K-Drama Hub</a>
            <div class="nav-links">
                <a href="/">Inicio</a>
                <a href="/login.html" class="active">🔐 Iniciar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <div class="login-card">
            <h1>🔐 Iniciar Sesión</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Ingresar</button>
            </form>
            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        // Si ya está logueado, redirigir
        if (localStorage.getItem("token")) {
            const rol = localStorage.getItem("usuario_rol");
            if (rol === "admin") {
                window.location.href = "/admin.html";
            } else {
                window.location.href = "/";
            }
        }

        const form = document.getElementById("loginForm");
        const messageDiv = document.getElementById("message");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch(`${API}/login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
                    method: "POST"
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || "Error al iniciar sesión");
                }

                const data = await response.json();

                localStorage.setItem("token", data.access_token);
                localStorage.setItem("usuario_id", data.usuario_id);
                localStorage.setItem("usuario_nombre", data.nombre);
                localStorage.setItem("usuario_rol", data.rol);

                messageDiv.className = "message success";
                messageDiv.textContent = "✅ Inicio de sesión exitoso! Redirigiendo...";

                setTimeout(() => {
                    if (data.rol === "admin") {
                        window.location.href = "/admin.html";
                    } else {
                        window.location.href = "/";
                    }
                }, 1500);

            } catch (error) {
                messageDiv.className = "message error";
                messageDiv.textContent = error.message;
            }
        });
    </script>
</body>
</html>
